name: Egyptian Arabic Words Reel

on:
  schedule:
    # Daily, offset from the top of the hour to reduce GitHub scheduler delays.
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: "Upload to YouTube? Leave false for a dry run."
        required: true
        default: false
        type: boolean

permissions:
  contents: write      # needed to commit state files back to the repo

jobs:
  generate-arabic-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube credentials
        if: ${{ github.event_name == 'schedule' || inputs.upload_to_youtube == true }}
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}'     > token.json

      - name: Run Egyptian Arabic reel
        env:
          ARABIC_WORDS_REEL: "true"
          ARABIC_SHEET_CSV_URL: ${{ secrets.ARABIC_SHEET_CSV_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Achird' }}
          UPLOAD_TO_YOUTUBE: ${{ github.event_name == 'schedule' || inputs.upload_to_youtube == true }}
          PREVIEW_ONLY: "false"
        run: python3 generate_reel.py

      - name: Upload dry-run artifact
        if: ${{ github.event_name != 'schedule' && inputs.upload_to_youtube != true }}
        uses: actions/upload-artifact@v4
        with:
          name: egyptian-arabic-reel-dry-run
          path: |
            outputs/arabic_words_reel.mp4
            outputs/arabic_words_image.png

      - name: Save Arabic word index
        if: ${{ github.event_name == 'schedule' || inputs.upload_to_youtube == true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_arabic.json
          git diff --staged --quiet || git commit -m "chore: advance Arabic word index [skip ci]"
          git push

      - name: Send email notification
        if: always()
        env:
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          WORKFLOW_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "NOTIFY_EMAIL_TO",
              "NOTIFY_EMAIL_FROM",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print("Email notification skipped. Missing secrets: " + ", ".join(missing))
              raise SystemExit(0)

          status = os.getenv("WORKFLOW_STATUS", "unknown")
          run_url = os.getenv("RUN_URL", "")
          subject = f"Egyptian Arabic Words Reel: {status}"
          body = (
              f"Egyptian Arabic Words Reel finished with status: {status}\n\n"
              f"Workflow run:\n{run_url}\n"
          )

          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = os.environ["NOTIFY_EMAIL_FROM"]
          msg["To"] = os.environ["NOTIFY_EMAIL_TO"]
          msg.set_content(body)

          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]

          if port == 465:
              with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context()) as server:
                  server.login(username, password)
                  server.send_message(msg)
          else:
              with smtplib.SMTP(host, port) as server:
                  server.starttls(context=ssl.create_default_context())
                  server.login(username, password)
                  server.send_message(msg)
          PY
