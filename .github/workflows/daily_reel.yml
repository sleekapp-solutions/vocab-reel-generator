name: Daily Vocab Reel

on:
  schedule:
    # Test schedule: 6:11 AM PDT / 1:11 PM UTC, then 9:11 AM PDT / 4:11 PM UTC.
    - cron: "11 13 * * *"
    - cron: "11 16 * * *"
  workflow_dispatch:   # allows manual trigger from GitHub UI (useful for testing)

permissions:
  contents: write      # needed to commit state.json back to the repo

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo (includes state.json) ──────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Install system dependencies ───────────────────────────────────
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core fonts-liberation

      # ── 3. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 4. Install Python packages ────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Write YouTube secrets to disk ─────────────────────────────────
      #    client_secrets.json → from Google Cloud Console (OAuth 2.0 client)
      #    token.json          → generated once locally, then stored as secret
      - name: Write YouTube credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}'     > token.json

      # ── 6. Generate image, audio, video + upload to YouTube ───────────────
      - name: Run VocabReelGenerator
        env:
          SHEET_CSV_URL:     ${{ secrets.SHEET_CSV_URL }}
          UPLOAD_TO_YOUTUBE: "true"
          PREVIEW_ONLY:      "false"
        run: python3 generate_reel.py

      # ── 7. Commit updated state.json back to the repo ─────────────────────
      #    [skip ci] prevents this commit from triggering another workflow run
      - name: Save word index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: advance word index [skip ci]"
          git push

      # ── 8. Email notification ────────────────────────────────────────────
      #    Add SMTP_* and NOTIFY_EMAIL_* secrets to enable this.
      - name: Send email notification
        if: always()
        env:
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          WORKFLOW_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "NOTIFY_EMAIL_TO",
              "NOTIFY_EMAIL_FROM",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print("Email notification skipped. Missing secrets: " + ", ".join(missing))
              raise SystemExit(0)

          status = os.getenv("WORKFLOW_STATUS", "unknown")
          run_url = os.getenv("RUN_URL", "")
          subject = f"Daily Vocab Reel: {status}"
          body = (
              f"Daily Vocab Reel finished with status: {status}\n\n"
              f"Workflow run:\n{run_url}\n"
          )

          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = os.environ["NOTIFY_EMAIL_FROM"]
          msg["To"] = os.environ["NOTIFY_EMAIL_TO"]
          msg.set_content(body)

          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]

          if port == 465:
              with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context()) as server:
                  server.login(username, password)
                  server.send_message(msg)
          else:
              with smtplib.SMTP(host, port) as server:
                  server.starttls(context=ssl.create_default_context())
                  server.login(username, password)
                  server.send_message(msg)
          PY
